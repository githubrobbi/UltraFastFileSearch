[[audits.quick-xml]]
who = "Robert M1 <50460704+githubrobbi@users.noreply.github.com>"
criteria = "safe-to-deploy"
delta = "0.39.2 -> 0.39.4"
notes = "Delta audit (cargo vet diff 0.39.2 -> 0.39.4, 3 files +35/-10). Cargo.toml/Cargo.toml.orig: version bump only. src/parser/dtd.rs is the only source change — three robustness fixes to the DTD internal-subset parser, all panic-prevention: (a) when 9+ bytes already accumulated in UndecidedMarkup state without matching one of <!--, <![CDATA[, <!ELEMENT, <!ATTLIST, <!ENTITY, <!NOTATION, fall through to 'skip until >' instead of staging more bytes than the 9-byte work buffer can hold (which would have panicked on the slice copy in UndecidedMarkup); (b) symmetric fix in the keyword-scan branch when the full 9-byte window has been consumed; (c) removes the 'markup.len() < 9 => None' bail-out and changes the no-> fallback from 'Some(markup.len())' to 'None' so the caller correctly waits for more input rather than treating partial markup as complete. Plus two comment-typo fixes. No new unsafe, no new I/O / FFI / process surfaces, no API additions, no feature-gate changes. Pure parser bounds-hardening."

[[audits.quinn]]
who = "Robert M1 <50460704+githubrobbi@users.noreply.github.com>"
criteria = "safe-to-deploy"
delta = "0.11.9 -> 0.11.11"
notes = "Full diff reviewed. Runtime changes are confined to async plumbing: EndpointRef/ConnectionRef reference counts move from mutex-guarded usize to AtomicUsize (Relaxed, plain inc/dec with last-owner check), drive_timer is reworked to check the clock before polling the tokio Sleep so elapsed deadlines are not masked by tokio's cooperative budget, and RecvStream::drop/stop now clean blocked_readers entries to avoid leaking wakers. The only new unsafe code is a raw-waker vtable in cfg(test)-gated src/tests.rs; production code adds no unsafe. build.rs is unchanged (trivial cfg_aliases only); no new runtime dependencies — rustls-pemfile dev-dep removed, a private __rustls-post-quantum-test feature and a feature-gated integration test are added, and the quinn-proto requirement is bumped to 0.11.15. Cargo.lock churn (asn1-rs, der-parser, etc.) affects only the workspace's dev/test resolution, not dependents. No new fs/net/process/env access; example server.rs switches PEM parsing from rustls-pemfile to rustls-pki-types helpers. MSRV raised to 1.85."

[[audits.quinn-proto]]
who = "Robert M1 <50460704+githubrobbi@users.noreply.github.com>"
criteria = "safe-to-deploy"
delta = "0.11.14 -> 0.11.16"
notes = "Full diff reviewed; crate remains sans-IO with no unsafe, no build script, and no fs/net/process/env access. The two substantive network-facing changes are defensive: Assembler::insert now returns TooManyChunks when more than 1024 buffered chunks survive defragmentation, closing the connection via TransportError on maliciously fragmented STREAM/CRYPTO frames (memory-exhaustion hardening, mirroring ngtcp2), and the server endpoint now silently drops Initial packets when CIDs are exhausted or max_incoming is reached, before deriving initial keys, instead of doing crypto work to send CONNECTION_REFUSED (CPU-exhaustion hardening; a regression test asserts the client times out). Loss detection and RTT math switch from panicking Instant subtraction to saturating_duration_since/abs_diff, and CUBIC fast convergence is corrected per RFC 9438 using the pre-reduction window. Dependency changes are the rand 0.9 -> 0.10 migration (RngExt/TryRng/SysRng API renames, getrandom 0.4 on wasm), rand_pcg promoted from dev to runtime dependency solely so BBR's pacing jitter uses Pcg32 (non-cryptographic use; CID/token/reset-token randomness still comes from StdRng seeded from the system RNG), plus fastbloom 0.14 -> 0.17 and rustls-platform-verifier 0.6 -> 0.7 version bumps. MSRV raised to 1.85."

[[audits.rand]]
who = "Robert M1 <50460704+githubrobbi@users.noreply.github.com>"
criteria = "safe-to-deploy"
