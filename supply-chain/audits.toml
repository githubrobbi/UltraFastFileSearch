[[audits.rmcp]]
who = "Robert Nio <50460704+githubrobbi@users.noreply.github.com>"
criteria = "safe-to-deploy"
delta = "1.6.0 -> 1.7.0"
notes = "Inspected 1.6.0->1.7.0 source diff (8 .rs files, ~50 lines of net change). No new unsafe blocks, no new fs/net/process/FFI surface, no crypto/auth/permission changes. Notable shifts: (a) JsonRpcError.id widened to Option<RequestId> per MCP 2025-11-25 error-response spec; (b) PromptMessageContent::Resource flattened to fix a JSON shape bug (with regression test); (c) async_rw transport switched from FramedRead to BufReader + manual line decode, adding parse-error recovery (sends JSON-RPC -32700 and continues instead of terminating) AND UTF-8 BOM stripping (RFC 8259 §8.1); (d) Cargo.toml narrows chrono to default-features=false + only the 'now' feature (surface reduction). All changes match the published CHANGELOG and are robustness improvements."

[[audits.rmcp]]
who = "Robert M1 <50460704+githubrobbi@users.noreply.github.com>"
criteria = "safe-to-deploy"
delta = "1.7.0 -> 1.8.0"
notes = 'Delta audit (cargo vet diff, 17 src files). Verified zero `unsafe` in src/ in BOTH versions, build.rs byte-identical, and every powerful-import count unchanged (std::process=1, Command::new=5, std::net=0, std::fs=0, from_raw=3, include_str=1, include_bytes=0) -- no new ambient authority. Changes: (a) new handler/server/common.rs::schema_for_input which generates a JSON schema, validates the root is type "object" per MCP spec and strips top-level title/description, caches per-TypeId and returns Result (the error rmcp-macros now unwraps); (b) MCP protocol/model refinements (model/capabilities, elicitation_schema, tool; service client/server); (c) transport/auth.rs (OAuth2 client) refactor that ADDS hardening -- a 30s request timeout, a 1 MiB cap on OAuth HTTP response bodies, and an explicit OAuthHttpRedirectPolicy; reqwest was already a 1.7.0 dependency; (d) streamable-http and unix-socket client transports treat an empty 2xx success as 202 Accepted for notification/response/error messages (spec compatibility). New regression tests added. No new unsafe, fs, process, or net capability. Minor release by alexhancock (rmcp maintainer).'

[[audits.rmcp]]
who = "Robert M1 <50460704+githubrobbi@users.noreply.github.com>"
criteria = "safe-to-deploy"
delta = "1.8.0 -> 2.1.0"
notes = "Delta audit (cargo vet diff 1.8.0 -> 2.1.0, ~10k-line diff; bulk is the MCP 2025-11-25 spec migration in src/model/* - mechanical serde type renames (GetTaskInfoParams->GetTaskParams, CreateElicitationRequest->ElicitRequest, request_id becomes Option, etc.) plus matching handler/service plumbing and large test additions). Capability grep of ALL added lines found net/process usage ONLY inside #[cfg(test)] blocks and tests/ (loopback axum test servers, test child-process spawn); zero new unsafe. Security-relevant runtime changes are all HARDENING: (1) transport/auth.rs adds SSRF protections to OAuth discovery - redirects now manually followed with same-origin enforcement + 10-redirect cap, authorization-server metadata URLs rejected for private/loopback/link-local/CGNAT/benchmark ranges, IPv4-mapped IPv6, localhost and cloud metadata hosts (metadata.google.internal etc.); RFC 9728 resource field now required and must match base_url; resource_metadata URLs from WWW-Authenticate must be same-origin; RFC 6749 s6 fix retains the old refresh token when a refresh response omits one. (2) reqwest default client sets redirect::Policy::none so custom headers cannot replay to redirect targets. (3) streamable_http_server/tower.rs validates the MCP-Protocol-Version header before creating a session. (4) transport/async_rw.rs fixes read_until cancellation safety (partial line kept across select! polls) and stops replying to syntactically-invalid JSON (error-storm prevention, matches other official SDKs; well-formed-but-wrong JSON still gets Invalid Request). Publisher alexhancock (Alex Hancock) - crates.io shows the SAME publisher for 1.7.0/1.8.0/2.0.0/2.1.0, i.e. continuity with our accepted baseline; repo is the official modelcontextprotocol/rust-sdk."

[[audits.rmcp]]
who = "Robert M1 <50460704+githubrobbi@users.noreply.github.com>"
criteria = "safe-to-deploy"
delta = "2.1.0 -> 2.2.0"
notes = "Reviewed full 2.1.0->2.2.0 diff. 'unsafe' count 0 -> 0; no runtime dependency or feature changes (only a version bump + a new [[test]] registration). Changes are the documented conformance/robustness work: reject auth servers lacking S256 PKCE + metadata-discovery host allowlisting/SSRF hardening in transport/auth.rs (client/http feature this project does not enable); don't respond to cancelled requests (service.rs); TTL seconds->milliseconds per MCP spec with a deprecated alias (task_manager.rs); fail orphaned streamable-HTTP responses on session reinit (streamable_http_client.rs); mime 'text'->'text/plain' (model). Only URLs in the diff are example.com in tests. No suspicious endpoints or exfiltration."

[[audits.rmcp]]
who = "Robert M1 <50460704+githubrobbi@users.noreply.github.com>"
criteria = "safe-to-deploy"
delta = "2.2.0 -> 3.1.0"
notes = "Delta audit (cargo vet diff 2.2.0 -> 3.1.0), ~34k-line major-version diff; all changed src/ files were enumerated and reviewed (transport/auth.rs, service/client.rs and new service/client/cache.rs, transport/streamable_http_client.rs, task_manager.rs, streamable_http_server/tower.rs and session files, service.rs, service/server.rs, client_side_sse.rs, reqwest/unix-socket/child-process/async_rw transports, error.rs, lib.rs, handlers, and the new model/mrtr.rs, model/request_state.rs, transport/common/mcp_headers.rs read in full); model-type files (model.rs, meta.rs, serde_impl.rs, task.rs, capabilities.rs, etc.) were reviewed at item level and are serde/schema type changes only. No unsafe anywhere in the diff, no build.rs, no new URLs or domains outside example.com/localhost test fixtures and spec doc links, and no new filesystem/process/env access; child_process.rs only deletes a deprecated API. New optional deps hmac 0.13 and sha2 0.11 back the new request-state feature, an HMAC-SHA256 integrity codec for SEP-2322 requestState with constant-time verification and a redacted-key Debug impl; base64 bumps to 0.23 and jsonwebtoken to 11. Nature of release: MCP 2026-07-28 protocol work — server/discover lifecycle, SEP-2549 client response cache, SEP-2663 task manager, SEP-2322 MRTR, SEP-2243 standard headers, SEP-2260 request-association enforcement, subscription streams. Security posture improves: OAuth discovery gains RFC 8414 issuer validation, stricter RFC 8707 resource matching, refresh-rejection classification, issuer-change credential invalidation, and removal of the unauthenticated POST probe; DoS hardening adds a 16 MiB SSE event cap and a 4 MiB server request-body cap. Capability surface (HTTP client/server to caller-configured endpoints, stdio child-process transport, Unix sockets) is unchanged in kind and honestly consistent with an MCP protocol SDK; no malicious or obfuscated code observed."

