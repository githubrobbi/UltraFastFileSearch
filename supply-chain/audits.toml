notes = "Delta audit (cargo vet diff 0.2.1 -> 0.2.2, 4 files +72/-8). Cargo.toml/Cargo.toml.orig: version bump only. README.md + src/lib.rs doc-comments: add note that num-conv is being uplifted into the standard library (rust-lang/rust#154330). src/lib.rs: introduces new 'Widen' trait + 'WidenTarget' + sealed 'WidenTargetSealed' as the going-forward names for the existing 'Extend'/'ExtendTarget'/'ExtendTargetSealed' trio. The old Extend trait is kept with #[deprecated(since='0.2.2', note='use Widen instead')] for backward compat; #[allow(deprecated)] internally so the existing impls still compile. The Widen implementation is bit-identical to Extend ('self as _' for size-preserving widening). impl_extend! macro renamed to impl_widen!, but it emits BOTH the new WidenTargetSealed/WidenTarget impls AND retains the deprecated ExtendTargetSealed/ExtendTarget impls so downstream code calling .extend() still works. No new unsafe (none exists in this crate), no new ambient capabilities, no I/O / FFI / process / network — pure trait rename-with-deprecation release prefacing the stdlib uplift. jhpratt is the time-rs maintainer; same publisher as the existing 0.2.1 we already trust transitively via time."

[[audits.object]]
who = "Robert M1 <50460704+githubrobbi@users.noreply.github.com>"
criteria = "safe-to-deploy"
delta = "0.37.3 -> 0.39.1"
notes = "Diff is ~8300 lines and matches the upstream changelog: relocation-handling refinements, new ELF/Mach-O constants, PE import-parsing hardening (errors on empty import names, handles names in other sections), and new Mach-O exports-trie/function-starts parsers. No new unsafe blocks; the removal of the `unaligned` feature redefines fixed-endian integer types as `[u8; N]` wrappers so the pre-existing `unsafe_impl_endian_pod!` impls are trivially sound, and `slice_from_all_bytes` now rejects zero-sized types instead of dividing by zero. build.rs is byte-identical (rustc version probe only); no new dependencies, only version bumps of hashbrown (0.15->0.17), indexmap (2.0->2.14), and wasmparser (0.236->0.247). No fs/net/process/env access added to library code; `std::fs` appears only in new integration tests reading checked-in test files. New parsing code uses bounds-checked `Bytes` reads throughout; one robustness observation: the new exports-trie iterator (`src/read/macho/exports_trie.rs`) follows uleb128 child offsets with no cycle detection, so a crafted trie can cause non-termination/unbounded allocation in that opt-in iterator (availability only, no memory unsafety). `read::SymbolMap` code was relocated from `read/mod.rs` to a new `symbol_map.rs` with the documented size-parameter API change. Nothing suspicious observed; consistent with safe-to-deploy."

